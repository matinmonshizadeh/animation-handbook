<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Handbook</title>
  <style>
    :root{--bg:#060a10;--ui-bg:#0d1117;--border:#21262d;--text:#c9d1d9;--muted:#8b949e;--c1:#58a6ff;--c2:#56d364;--c3:#d2a8ff;--c4:#ffa657;--c5:#f85149;--c6:#56d364;--c7:#58a6ff}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:monospace;padding:clamp(20px,4vw,56px) clamp(16px,4vw,48px);max-width:1100px;margin:0 auto}
    .hero{margin-bottom:clamp(40px,6vw,72px);padding-bottom:32px;border-bottom:1px solid var(--border)}
    h1{font-size:clamp(14px,2.4vw,22px);letter-spacing:4px;text-transform:uppercase;margin-bottom:12px}
    .hero-sub{font-size:clamp(11px,1.4vw,13px);color:var(--muted);line-height:1.7;max-width:560px;margin-bottom:20px}
    .hero-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    .hero-link{font-size:11px;color:var(--c1);text-decoration:none;letter-spacing:1px}
    @media(hover:hover){.hero-link:hover{text-decoration:underline}}
    .badge{font-size:10px;background:var(--ui-bg);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:20px;letter-spacing:1px;white-space:nowrap}
    .cat{margin-bottom:clamp(40px,6vw,64px)}
    .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    h2{font-size:clamp(10px,1.4vw,12px);text-transform:uppercase;letter-spacing:2.5px;color:var(--muted)}
    .cat-desc{font-size:11px;color:var(--muted);margin-bottom:20px;padding-left:18px;line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    @media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
    .card{background:var(--ui-bg);border:1px solid var(--border);border-radius:6px;transition:border-color .15s,transform .15s;min-height:80px}
    @media(hover:hover){.card:hover{transform:translateY(-1px)}}
    .card a{display:block;padding:14px 16px;text-decoration:none;color:inherit;height:100%}
    .card-name{font-size:clamp(11px,1.3vw,13px);font-weight:bold;margin-bottom:5px;transition:color .15s}
    .card-desc{font-size:10px;color:var(--muted);line-height:1.6}
    .c1-cat .card:hover{border-color:var(--c1)}.c1-cat .card:hover .card-name{color:var(--c1)}
    .c2-cat .card:hover{border-color:var(--c2)}.c2-cat .card:hover .card-name{color:var(--c2)}
    .c3-cat .card:hover{border-color:var(--c3)}.c3-cat .card:hover .card-name{color:var(--c3)}
    .c4-cat .card:hover{border-color:var(--c4)}.c4-cat .card:hover .card-name{color:var(--c4)}
    .c5-cat .card:hover{border-color:var(--c5)}.c5-cat .card:hover .card-name{color:var(--c5)}
    .c6-cat .card:hover{border-color:var(--c6)}.c6-cat .card:hover .card-name{color:var(--c6)}
    .c7-cat .card:hover{border-color:var(--c7)}.c7-cat .card:hover .card-name{color:var(--c7)}
    .planned{margin-bottom:16px}
    .planned h2{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:12px;opacity:.45}
    .soon-list{display:flex;gap:8px;flex-wrap:wrap}
    .soon{font-size:10px;color:var(--muted);background:var(--ui-bg);border:1px solid var(--border);padding:6px 14px;border-radius:20px;opacity:.35;letter-spacing:1px}
    @media(max-width:600px){.hero-meta{flex-direction:column;align-items:flex-start}}
    .hero{position:relative}
    #gh-stars{position:absolute;top:clamp(12px,3vw,20px);right:clamp(12px,3vw,20px);display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:var(--ui-bg);border:1px solid var(--border);border-radius:20px;text-decoration:none;color:var(--text);font-family:monospace;font-size:11px;line-height:1;transition:background .15s,transform .15s,border-color .15s;white-space:nowrap;min-height:44px;min-width:44px}
    @media(hover:hover){#gh-stars:hover{background:#161b22;border-color:#30363d;transform:translateY(-1px)}}
    #gh-stars:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
    .gh-icon{flex-shrink:0;opacity:.85}
    .gh-label{color:var(--muted)}
    @media(max-width:600px){.gh-label{display:none}}
    .gh-sep{color:var(--border);margin:0 1px}
    @media(max-width:600px){.gh-sep{display:none}}
    .gh-star-wrap{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
    #gh-star-count{min-width:1ch}
    #gh-stars.no-count .gh-sep,#gh-stars.no-count .gh-star-wrap{display:none}
  </style>
</head>
<body>
<div class="hero">
  <a id="gh-stars" href="https://github.com/matinmonshizadeh/animation-handbook" target="_blank" rel="noopener noreferrer" aria-label="View animation-handbook on GitHub">
    <svg class="gh-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 98 96" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/></svg>
    <span class="gh-label">GitHub</span>
    <span class="gh-sep">·</span>
    <span class="gh-star-wrap">&#9733;&nbsp;<span id="gh-star-count">—</span></span>
  </a>
  <h1>Animation Handbook</h1>
  <p class="hero-sub">A visual reference of web animation techniques. Each entry is a self-contained demo with an explanation of the mechanic — open any HTML file and it runs offline, no build step.</p>
  <div class="hero-meta">
    <a class="hero-link" href="https://github.com/matinmonshizadeh/animation-handbook">github.com/matinmonshizadeh/animation-handbook →</a>
    <span class="badge">100 animations · 7 categories</span>
  </div>
</div>
<div id="root"></div>
<script>
(function loadStars(){
  const KEY='gh-star-count',TTL=5*60*1000;
  function updateUI(n){
    const el=document.getElementById('gh-star-count');
    if(!el)return;
    el.textContent=Number(n).toLocaleString();
    const link=document.getElementById('gh-stars');
    if(link)link.setAttribute('aria-label','View animation-handbook on GitHub ('+Number(n).toLocaleString()+' stars)');
  }
  try{
    const cached=localStorage.getItem(KEY);
    if(cached){
      const{count,ts}=JSON.parse(cached);
      if(Date.now()-ts<TTL){updateUI(count);return;}
    }
  }catch(e){}
  fetch('https://api.github.com/repos/matinmonshizadeh/animation-handbook')
    .then(function(r){if(!r.ok)throw new Error();return r.json();})
    .then(function(d){
      const n=d.stargazers_count;
      updateUI(n);
      try{localStorage.setItem(KEY,JSON.stringify({count:n,ts:Date.now()}));}catch(e){}
    })
    .catch(function(){
      const el=document.getElementById('gh-stars');
      if(el)el.classList.add('no-count');
    });
})();

const CATS=[
  {
    name:'Scroll-Based',cat:'c1-cat',dot:'#58a6ff',n:'01',
    desc:'Animations driven by scroll position — parallax, sticky, scrub, snap, and narrative storytelling.',
    folder:'animations/01-scroll-based',
    entries:[
      ['parallax-depth-of-field','Parallax Depth-of-Field','Five mountain layers translate at different speeds; blur simulates camera depth-of-field.'],
      ['parallax-scrolling','Parallax Scrolling','Elements move at different speeds — background slower, foreground faster — creating a 3D depth illusion.'],
      ['reverse-scrolling-columns','Reverse-Scrolling Columns','A center column scrolls normally while two flanking columns scroll in reverse, looping infinitely.'],
      ['cover-card-to-fixed-header','Cover Card to Fixed Header','A full-page hero morphs into a compact fixed header — every visual property scrubbed to a single progress value.'],
      ['fly-in-fly-out-contact-list','Fly-in Fly-out Contact List','Rows translate and fade through entry, active, and exit zones as you scroll — bidirectional and continuous.'],
      ['stacking-cards','Stacking Cards','CSS Scroll-Driven Animations fan cards into a deck — per-index sticky offset creates the visible peek tab.'],
      ['scroll-trigger','ScrollTrigger Animation','The onEnter / onLeave lifecycle demonstrated with vanilla JS — four scroll trigger zones.'],
      ['scrub-animation','Scrub Animation','Every transform welded to scroll position — scrub backward and the animation reverses perfectly.'],
      ['pin-animation','Pin Animation','An element freezes in place while the page scrolls beneath it — CSS sticky, no JavaScript pinning.'],
      ['snap-scrolling','Snap Scrolling','CSS scroll-snap-type creates a paginated, magnetic feel — mandatory, proximity, and none compared.'],
      ['scrollytelling','Scrollytelling','Fractional chapter progress drives continuous depth crossfades across six ocean-layer chapters.'],
      ['reveal-on-scroll','Reveal on Scroll','Seven reveal techniques fired by IntersectionObserver at a configurable trigger line.'],
      ['stagger-reveal','Stagger Reveal','Groups reveal with cascading delays — forward, reverse, center-out, and random cascade directions.'],
      ['horizontal-scroll','Horizontal Scroll','Vertical scroll translates a horizontal panel strip — a tall pinned section provides the scroll budget.'],
      ['sticky-section','Sticky Section','The whole section pins while its interior morphs through four states scrubbed to scroll position.'],
      ['counter-animation','Counter Animation','Numbers count 0 → target with easing on scroll entry — four formats and configurable curve.'],
      ['progress-bar','Progress Bar','Reading progress in three styles — top bar, circular ring, and side rail — driven by scrollTop / scrollHeight.'],
      ['section-wipe','Section Wipe','The next section slides over the current via sticky z-index stacking — scale-down adds depth.'],
      ['zoom-into-image','Zoom Into Image','clip-path expands from a framed card to full-bleed as you scroll — the portal effect.'],
    ]
  },
  {
    name:'Entrance & Exit',cat:'c2-cat',dot:'#56d364',n:'02',
    desc:'Element-level animations for arriving and departing — fades, slides, reveals, flips, and text staggers.',
    folder:'animations/02-entrance-and-exit',
    entries:[
      ['fade-in-out','Fade In / Fade Out','Opacity 0 → 1 enter, 1 → 0 exit — the compositor handles this without re-painting.'],
      ['slide-in','Slide In','Translates from an off-screen edge into final position — with or without simultaneous fade.'],
      ['slide-up-reveal','Slide Up Reveal','Text rises from below its clip boundary — translateY method vs clip-path inset, identical visual result.'],
      ['scale-in','Scale In / Zoom In','Scales from a small start value to 1.0 — transform-origin controls where the pop expands from.'],
      ['clip-path-reveal','Clip-Path Reveal','A shape mask expands to uncover the element — content is always rendered, just progressively visible.'],
      ['curtain-reveal','Curtain Reveal','A colored bar slides over content then off the other side — the reveal is hidden then exposed.'],
      ['split-text-reveal','Split Text Reveal','Text split into chars, words, or lines — each piece staggers with --index CSS transition-delay.'],
      ['letter-by-letter-stagger','Letter-by-Letter Stagger','CSS transition-delay cascade per letter, or JS typewriter mode with a blinking cursor.'],
      ['word-by-word-reveal','Word-by-Word Reveal','Words animate sequentially at 80–120ms per word — the readable stagger speed for taglines.'],
      ['blur-in','Blur In','Fades in while reducing blur — mimics camera focus pulling. Best on single hero elements.'],
      ['flip-in','Flip In','Rotates from a flat plane into view using CSS 3D perspective — perspective on the parent is the key.'],
      ['bounce-in','Bounce In','Overshoots final position then springs back — explicit @keyframes waypoints, not easing alone.'],
      ['rotate-in','Rotate In','Spins while entering — best on radially-symmetric shapes like icons, stars, and gears.'],
    ]
  },
  {
    name:'Page Transitions',cat:'c3-cat',dot:'#d2a8ff',n:'03',
    desc:'Full-page transitions between routes or views — crossfades, slides, portals, morphs, and the browser-native API.',
    folder:'animations/03-page-transitions',
    entries:[
      ['view-transitions-api','View Transitions API','document.startViewTransition() — the browser captures before/after and animates automatically.'],
      ['shared-element-transition','Shared Element Transition','A thumbnail morphs continuously into a detail hero as pages change — the FLIP technique applied.'],
      ['morph-transition','Morph Transition','An SVG path morphs between page-specific shapes — point-by-point interpolation across 12-vertex paths.'],
      ['crossfade','Crossfade','Both pages visible simultaneously at ~50% opacity mid-transition — compare with sequential fade.'],
      ['slide-transition','Slide Transition','Directional slides with forward/back awareness — matches native iOS and Android navigation patterns.'],
      ['zoom-transition','Zoom Transition','Three scale variants — zoom-in, zoom-out, pull-through — each implying different spatial depth.'],
      ['flash-transition','Flash / Light Leak','A colored flash peaks at full opacity, hides the page swap, then fades to reveal the new scene.'],
      ['blur-transition','Blur Transition','Current page blurs and fades out, then new page sharpens in — a defocus wipe between scenes.'],
      ['elastic-transition','Elastic Transition','Spring physics cause overshoot before settling — CSS keyframes or live JS spring simulation.'],
      ['portal-zoom','Portal / Tunnel Zoom','clip-path expands from a portal element\'s center, zooming the viewport into the next page.'],
      ['dissolve','Dissolve','Random tiles fade at staggered delays — a non-uniform wipe that reads as dissolving rather than fading.'],
      ['flip-technique','FLIP Technique','First-Last-Invert-Play — CSS layout changes animated seamlessly by measuring position deltas.'],
    ]
  },
  {
    name:'Micro-Interactions',cat:'c4-cat',dot:'#ffa657',n:'04',
    desc:'Short, user-triggered animations — hover, click, focus, loading states, and UI feedback patterns.',
    folder:'animations/04-micro-interactions',
    entries:[
      ['hover-state','Hover State Animation','Six hover techniques side by side — color shift, scale, lift, underline grow, icon nudge, and background sweep.'],
      ['click-ripple','Click / Tap Ripple','Ripple emanates from the exact click point — Material Design\'s tactile confirmation pattern.'],
      ['focus-ring','Focus Ring Animation','Animated outline on keyboard Tab — :focus-visible ensures mouse users see no ring.'],
      ['button-press-scale','Button Press Scale','Scales to 0.95 on press, springs back on release — asymmetric timing gives a tactile feel.'],
      ['toggle-switch','Toggle / Switch Slide','Pill slides left/right for on/off — smooth cubic-bezier gives a weighted, physical feel.'],
      ['skeleton-loader','Skeleton Loader','Pulsing placeholder blocks match the shape of real content — reduces perceived wait time.'],
      ['shimmer-effect','Shimmer Effect','Gradient sweep over skeleton placeholders — gives the impression of data streaming in.'],
      ['loading-spinner','Loading Spinner','Six spinner variants from a single CSS color and speed — ring, orbit, arc, bounce, pulse, square.'],
      ['progress-animation','Progress Animation','Linear bar, circular ring, and stepped segments — all driven by a single percentage value.'],
      ['checkmark-draw','Checkmark Draw','SVG path draws progressively on success — stroke-dashoffset animates from full length to zero.'],
      ['form-field-morph','Form Field Morph','Floating label rises out of the input on focus — persists when the field is filled.'],
      ['badge-pulse','Notification Badge Pulse','Dot on icon pulses to draw peripheral attention — scale, halo, or both.'],
      ['tooltip-reveal','Tooltip Reveal','Info box fades in after a 300ms delay — long enough to avoid triggering on mouse pass-through.'],
      ['drawer-slide','Drawer / Panel Slide','Off-canvas panel slides from edge — ease-out open, ease-in close. Backdrop dismisses.'],
      ['modal-expand','Modal Expand','Modal scales from the trigger button\'s position — transform-origin set to where you clicked.'],
      ['accordion','Accordion Open/Close','Height animates between 0 and auto — JS measured height vs CSS grid-template-rows compared.'],
      ['cursor-follower','Cursor Follower','Custom element follows mouse with lerp lag — mix-blend-mode: difference inverts any background.'],
    ]
  },
  {
    name:'Text & Typography',cat:'c5-cat',dot:'#f85149',n:'05',
    desc:'Animations specifically for type — kinetic motion, character-level effects, gradient flows, and word transformations.',
    folder:'animations/05-text-typography',
    entries:[
      ['kinetic-typography','Kinetic Typography','Phrases enter, transform, and exit in a choreographed timeline — motion reinforces meaning.'],
      ['typewriter-effect','Typewriter Effect','Characters appear one at a time with a blinking cursor — natural timing variance makes it feel human.'],
      ['scramble-text','Scramble / Glitch Text','Characters cycle randomly before locking left-to-right — decryption and sci-fi aesthetic.'],
      ['variable-font-morph','Variable Font Morph','CSS font-variation-settings animates weight, slant, and casual axes of a variable font.'],
      ['text-clip-path-reveal','Text Clip-Path Reveal','Lines reveal via expanding clip-path mask — preserves kerning and typographic spacing exactly.'],
      ['marquee-ticker','Marquee / Ticker','Continuous horizontal scroll with seamless loop — duplicated content makes the reset invisible.'],
      ['text-morphing','Text Morphing','One word transitions into another character by character — each letter slides out as the next slides in.'],
      ['text-gradient-animation','Text Gradient Animation','background-clip: text with animated background-position flows color through the characters.'],
      ['outline-to-fill','Outline to Fill','Hollow stroke letterforms fill with color — clip-path reveal or opacity crossfade.'],
      ['enter-exit-typography','Enter/Exit Typography','Three-act phrase lifecycle: enter → hold → exit, sequenced for storytelling.'],
      ['rotate-word-carousel','Rotate Word Carousel','One keyword cycles through a list while the surrounding sentence stays static.'],
    ]
  },
  {
    name:'3D & Advanced',cat:'c6-cat',dot:'#56d364',n:'06',
    desc:'WebGL, shaders, particles, 3D transforms, and the performance-sensitive effects that push the browser\'s limits.',
    folder:'animations/06-3d-advanced',
    entries:[
      ['3d-model-orbit','3D Model Orbit','Phong-shaded WebGL geometry — vertex buffers, MVP matrix, and lighting in raw WebGL.'],
      ['scroll-driven-3d-rotation','Scroll-Driven 3D Rotation','CSS cube rotates through four choreographed stages as you scroll — the Apple product-page pattern.'],
      ['parallax-3d-tilt','Parallax 3D Tilt','CSS perspective + rotateX/Y follows mouse — a shine highlight tracks the virtual light source.'],
      ['canvas-particle-effect','Canvas Particle Effect','500 drifting particles with O(n²) proximity connections and mouse repel/attract on 2D canvas.'],
      ['fluid-simulation','Fluid Simulation','WebGL metaballs — SDF spheres merged via smooth-minimum in a GLSL fragment shader.'],
      ['glassmorphism-animated','Glassmorphism Animated','backdrop-filter: blur() over animated gradient blobs — three frost variants.'],
      ['webgl-shader-animation','WebGL Shader Animation','Four GLSL fragment shader presets: plasma, wave distortion, Voronoi, kaleidoscope.'],
      ['noise-based-motion','Noise-Based Motion','Simplex noise drives a wind field and a morphing blob — smooth random, not chaotic random.'],
      ['svg-path-animation','SVG Path Animation','stroke-dashoffset reveals three SVG drawings — icon, signature, and logo mark.'],
      ['chromatic-aberration','Chromatic Aberration','RGB channels offset via mix-blend-mode: screen — static, pulse, and glitch modes.'],
      ['2-5d-pseudo-3d','2.5D / Pseudo-3D','Seven depth layers parallax at different rates — mouse-driven or auto-panning camera.'],
      ['ray-marching-sdf','Ray Marching / SDF','3D scene entirely in a fragment shader — sphere blend, boolean ops, infinite repetition.'],
      ['gpgpu-particle-system','GPGPU Particle System','65k+ particles computed in WebGL2 textures — physics in a shader, texture ping-pong.'],
      ['image-distortion-hover','Image Distortion on Hover','Fragment shader displaces UV coordinates around the cursor — ripple, push, liquid, pixelate.'],
      ['cloth-simulation','Cloth Simulation','Verlet integration + distance constraints — draggable flag responds to gravity and wind.'],
      ['volumetric-smoke','Volumetric Smoke','Ray marching accumulates 3D noise density — light scattering, shadow rays, fBm clouds.'],
    ]
  },
  {
    name:'Ambient & Background',cat:'c7-cat',dot:'#58a6ff',n:'07',
    desc:'Passive, looping effects that hold visual interest without demanding attention — gradients, particles, grain, and glows.',
    folder:'animations/07-ambient-background',
    entries:[
      ['animated-gradient-background','Animated Gradient Background','CSS gradient shifts hue and position continuously — pure CSS, no JavaScript, seamless loop.'],
      ['mesh-gradient','Mesh Gradient Animation','Blurred radial gradient blobs drift slowly — organic color washes popularized by Stripe.'],
      ['aurora','Aurora / Northern Lights','Tall color bands drift and skew horizontally — heavy blur fakes the curtain of light.'],
      ['grain-overlay','Grain / Film Noise Overlay','Animated noise at 5–10% opacity adds cinematic warmth — subtlety is everything.'],
      ['scanline','Scanline Effect','CRT horizontal lines with optional sweep beam, curvature, and phosphor glow.'],
      ['light-leak','Light Leak','Warm gradient fires at random irregular intervals — analog film camera aesthetic.'],
      ['starfield','Starfield / Space Particles','Stars drift outward from center with parallax depth — slow ambient speed, never hyperspace.'],
      ['breathing-glow','Breathing / Pulsing Glow','Radial glow expands and contracts on a 5-second breath cycle — calm resting state.'],
      ['ambient-ripple','Ambient Ripple Effect','Concentric rings emit periodically from idle sources — passive atmosphere, not click-driven.'],
      ['floating-elements','Floating Elements','Geometric shapes drift on independent sine-wave paths — no two elements synchronized.'],
      ['grid-dot-pattern-parallax','Grid / Dot Pattern Parallax','Pattern shifts subtly opposite to mouse movement — depth felt, barely seen.'],
      ['abstract-geometric-motion','Abstract Geometric Motion','Four hypnotic loops: rotating polygons, expanding rings, sliding bars, flowing color lines.'],
    ]
  }
];

const root=document.getElementById('root');
CATS.forEach(cat=>{
  const sec=document.createElement('div');sec.className='cat '+cat.cat;
  sec.innerHTML=`<div class="cat-head"><span class="cat-dot" style="background:${cat.dot}"></span><h2>${cat.n} — ${cat.name}</h2></div><p class="cat-desc">${cat.desc}</p>`;
  const grid=document.createElement('div');grid.className='grid';
  cat.entries.forEach(([slug,name,desc])=>{
    grid.innerHTML+=`<div class="card"><a href="${cat.folder}/${slug}/"><div class="card-name">${name}</div><div class="card-desc">${desc}</div></a></div>`;
  });
  sec.appendChild(grid);root.appendChild(sec);
});
</script>
</body>
</html>
