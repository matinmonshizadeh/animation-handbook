name: Bug report
description: A demo is broken, renders wrong, or misbehaves on some device/browser.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: which
    attributes:
      label: Which demo?
      description: The page's link or name.
      placeholder: e.g. Parallax Scrolling, or the link from your browser's address bar
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device
      placeholder: e.g. Safari 17 on iPhone 13, Chrome 120 on Windows
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo
        2. Scroll / click / resize to ...
        3. See ...
