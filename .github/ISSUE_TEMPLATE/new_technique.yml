name: New technique
description: Propose a new animation technique to add to the handbook.
title: "[technique] "
labels: ["new technique"]
body:
  - type: input
    id: name
    attributes:
      label: Technique name
      placeholder: e.g. Pull to refresh
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - 01 Scroll-Based
        - 02 Entrance & Exit
        - 03 Page Transitions
        - 04 Micro-Interactions
        - 05 Text & Typography
        - 06 3D & Advanced
        - 07 Ambient & Background
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is it?
      description: A 2–3 sentence description of the effect and how it behaves.
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference (optional)
      description: A link to an example of this technique in the wild.
  - type: checkboxes
    id: checks
    attributes:
      label: Fit check
      options:
        - label: This is a technique, not a specific library/tool.
          required: true
        - label: It can be demonstrated with vanilla HTML/CSS/JS, no dependencies.
          required: true
