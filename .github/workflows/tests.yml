# Runs the static tests (every page and its README, the shared stylesheet, the home page) on every push to main and on
# every pull request. Nothing to install: the tests use Node's own test runner.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.js"
